[project]
name = "auto-trading-india"
version = "0.1.0"
description = "NSE intraday trading bot"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "growwapi>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "pytz>=2023.3",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "textual>=0.70.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

# This is a flat application, not a distributable package: install with
# `pip install -r requirements.txt`. The file carries project metadata
# and tool configuration only, hence no [build-system].

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
