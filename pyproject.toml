[project]
name = "auto-trading-india"
version = "0.1.0"
description = "NSE intraday trading bot"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "pyarrow>=12.0.0",
    "growwapi>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "pytz>=2023.3",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "streamlit>=1.28.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
